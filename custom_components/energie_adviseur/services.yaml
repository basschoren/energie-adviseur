label_cycle:
  fields:
    appliance:
      required: true
      selector:
        config_entry:
          integration: energie_adviseur
    program:
      required: true
      selector:
        text:
    cycle_id:
      selector:
        text:
rename_program:
  fields:
    appliance:
      required: true
      selector:
        config_entry:
          integration: energie_adviseur
    program:
      required: true
      selector:
        text:
    new_name:
      required: true
      selector:
        text:
delete_program:
  fields:
    appliance:
      required: true
      selector:
        config_entry:
          integration: energie_adviseur
    program:
      required: true
      selector:
        text:
delete_cycle:
  fields:
    appliance:
      required: true
      selector:
        config_entry:
          integration: energie_adviseur
    cycle_id:
      required: true
      selector:
        text:
split_cycle:
  fields:
    appliance:
      required: true
      selector:
        config_entry:
          integration: energie_adviseur
    cycle_id:
      selector:
        text:
    minutes:
      selector:
        number:
          min: 1
          max: 1440
          unit_of_measurement: min
          mode: box
    keep:
      default: both
      selector:
        select:
          translation_key: split_keep
          options:
            - both
            - first
            - second
import_history:
  fields:
    entry:
      required: true
      selector:
        config_entry:
          integration: energie_adviseur
    days:
      default: 10
      selector:
        number:
          min: 1
          max: 730
          mode: box
